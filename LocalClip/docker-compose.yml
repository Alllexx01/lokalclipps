services:
  lokalclipps:
    build: .
    restart: unless-stopped
    environment:
      LOCALCLIP_DATA_DIR: /var/data
      LOCALCLIP_USERNAME: ${LOCALCLIP_USERNAME}
      LOCALCLIP_PASSWORD: ${LOCALCLIP_PASSWORD}
      LOCALCLIP_DOMAIN: ${LOCALCLIP_DOMAIN}
      LOCALCLIP_PC_HELPER: "1"
    volumes:
      - lokalclipps_data:/var/data
      - model_cache:/root/.cache/huggingface

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - lokalclipps
    ports:
      - "80:80"
      - "443:443"
    environment:
      LOCALCLIP_DOMAIN: ${LOCALCLIP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  lokalclipps_data:
  model_cache:
  caddy_data:
  caddy_config:
